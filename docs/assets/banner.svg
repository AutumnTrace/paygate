<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">paygate</title>
  <desc id="desc">paygate: a payment orchestration gateway routing payments across providers, with one provider's circuit open and traffic failing over to the next.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#121a36"/>
      <stop offset="1" stop-color="#1d1442"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cf0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>

  <!-- Wordmark -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="84" font-weight="700" fill="#f8fafc" letter-spacing="-1">paygate</text>
    <rect x="76" y="172" width="148" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="222" font-size="25" fill="#cbd5e1">Payment orchestration for iGaming operators</text>
    <text x="72" y="262" font-size="18" fill="#94a3b8">PSP routing · health-aware failover · circuit breakers</text>
    <text x="72" y="290" font-size="18" fill="#94a3b8">idempotent REST API · signed webhooks · .NET 10</text>
  </g>

  <!-- Illustration: deposits enter the gateway, which routes to three providers -->
  <g transform="translate(700 0)">
    <circle cx="210" cy="180" r="120" fill="url(#glow)"/>

    <!-- incoming payments -->
    <g stroke="#5eead4" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <line x1="20" y1="120" x2="160" y2="170"/>
      <line x1="20" y1="180" x2="160" y2="180"/>
      <line x1="20" y1="240" x2="160" y2="190"/>
    </g>
    <g fill="#5eead4">
      <circle cx="20" cy="120" r="6"/>
      <circle cx="20" cy="180" r="6"/>
      <circle cx="20" cy="240" r="6"/>
    </g>

    <!-- gateway -->
    <rect x="160" y="130" width="100" height="100" rx="22" fill="#151d3b" stroke="url(#accent)" stroke-width="3"/>
    <path d="M190 180h40M210 160v40" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" opacity="0.15"/>
    <path d="M188 168l14 12-14 12M206 168l14 12-14 12" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- provider A: circuit open (broken, dashed) -->
    <path d="M260 160 C 320 120, 360 90, 420 80" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.8"/>
    <rect x="420" y="56" width="120" height="48" rx="12" fill="#1f1530" stroke="#f87171" stroke-width="2"/>
    <circle cx="444" cy="80" r="7" fill="#f87171"/>
    <text x="460" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#fecaca">open</text>

    <!-- provider B: takes the traffic -->
    <path d="M260 180 C 330 180, 360 180, 420 180" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <rect x="420" y="156" width="120" height="48" rx="12" fill="#13233a" stroke="#5eead4" stroke-width="2"/>
    <circle cx="444" cy="180" r="7" fill="#5eead4"/>
    <text x="460" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ccfbf1">closed</text>

    <!-- provider C: idle, healthy -->
    <path d="M260 200 C 320 240, 360 270, 420 280" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.55"/>
    <rect x="420" y="256" width="120" height="48" rx="12" fill="#1a1838" stroke="#a78bfa" stroke-width="2" opacity="0.9"/>
    <circle cx="444" cy="280" r="7" fill="#a78bfa"/>
    <text x="460" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ddd6fe">closed</text>
  </g>
</svg>
