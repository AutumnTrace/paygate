name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build, unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit and API tests
        run: >-
          dotnet test --no-build -c Release
          --filter "Category!=Integration"
          --logger "trx;LogFileName=unit.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults/unit

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub" -assemblyfilters:"-*Tests*"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults/**

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build tests/Paygate.IntegrationTests -c Release

      - name: PostgreSQL and Kafka integration tests
        run: >-
          dotnet test tests/Paygate.IntegrationTests --no-build -c Release
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults/integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults/**

  docker:
    name: Docker image and compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image
        run: docker build -t paygate:local .

      - name: Standalone image on SQLite (README option C)
        run: |
          docker run -d --name standalone -p 8081:8080 -e ASPNETCORE_ENVIRONMENT=Development paygate:local
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8081/health/ready > standalone.json 2>/dev/null && break
            sleep 1
          done
          cat standalone.json
          grep -q '"status":"Healthy"' standalone.json

          curl -fsS -X POST http://localhost:8081/v1/payments \
            -H "X-Api-Key: pgk_test_demo_7c2f9a41e8b35d06" \
            -H "Idempotency-Key: ci-standalone-${GITHUB_RUN_ID}" \
            -H "Content-Type: application/json" \
            -d '{"amount":2500,"currency":"EUR","method":"card","country":"DE","customerId":"ci-player","paymentToken":"tok_visa_4242"}' \
            | tee standalone-payment.json
          grep -q '"status":"captured"' standalone-payment.json
          curl -fsS -o /dev/null http://localhost:8081/scalar/v1

      - name: Standalone container logs
        if: failure()
        run: docker logs standalone

      - name: Start the full stack
        run: docker compose up -d --no-build

      - name: Smoke test (PostgreSQL + Kafka inside the chiseled image)
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health/ready > ready.json 2>/dev/null && break
            sleep 2
          done
          cat ready.json
          grep -q '"name":"database","status":"Healthy"' ready.json
          grep -q '"name":"kafka","status":"Healthy"' ready.json

          curl -fsS -X POST http://localhost:8080/v1/payments \
            -H "X-Api-Key: pgk_test_demo_7c2f9a41e8b35d06" \
            -H "Idempotency-Key: ci-${GITHUB_RUN_ID}" \
            -H "Content-Type: application/json" \
            -d '{"amount":2500,"currency":"EUR","method":"card","country":"DE","customerId":"ci-player","paymentToken":"tok_visa_4242"}' \
            | tee payment.json
          grep -q '"status":"captured"' payment.json

          docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic payments.v1 --from-beginning \
            --max-messages 2 --timeout-ms 30000 --property print.key=true | tee events.txt
          test "$(grep -c "$(jq -r .id payment.json)" events.txt)" -ge 2

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
