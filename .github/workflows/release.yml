name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=paygate
            org.opencontainers.image.description=Payment orchestration gateway: PSP routing with failover, circuit breakers, idempotent APIs and signed webhooks

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: Verify the published image
    runs-on: ubuntu-latest
    needs: image
    steps:
      - name: Run the image exactly as the README says (anonymous pull)
        run: |
          docker logout ghcr.io || true
          docker run -d --name paygate -p 8080:8080 -e ASPNETCORE_ENVIRONMENT=Development \
            "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health/ready && break
            sleep 1
          done
          curl -fsS -X POST http://localhost:8080/v1/payments \
            -H "X-Api-Key: pgk_test_demo_7c2f9a41e8b35d06" \
            -H "Idempotency-Key: release-${GITHUB_RUN_ID}" \
            -H "Content-Type: application/json" \
            -d '{"amount":2500,"currency":"EUR","method":"card","country":"DE","customerId":"release-check","paymentToken":"tok_visa_4242"}' \
            | grep '"status":"captured"'

      - name: Container logs
        if: failure()
        run: docker logs paygate
