name: Feature request
description: Suggest a new capability, routing rule or provider behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What payment flow or operational need is not covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Sketch the API request/response or configuration you would like.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
