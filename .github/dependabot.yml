version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Npgsql*"]
      observability:
        patterns: ["OpenTelemetry*", "Azure.Monitor.*", "Serilog*"]
      testing:
        patterns: ["xunit*", "FsCheck*", "coverlet.*", "Testcontainers*", "BenchmarkDotNet*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
