version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # paygate targets .NET 10 (LTS). Packages that ship with the runtime move to a new major
    # together with the target framework, in a deliberate upgrade, not one Dependabot PR at a time.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      # Npgsql packages share one major version (and Npgsql 11 pairs with EF Core 11).
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.AspNetCore"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Npgsql*"]
      observability:
        patterns: ["OpenTelemetry*", "Azure.Monitor.*", "Serilog*"]
      testing:
        patterns: ["xunit*", "FsCheck*", "coverlet.*", "Testcontainers*", "BenchmarkDotNet*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Same reason: the SDK and runtime images follow the target framework.
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
